---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm ci
        npm run lint
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm ci
        npm test