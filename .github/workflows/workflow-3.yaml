name: job dependency

on:
    workflow_dispatch:

jobs:
    job-1:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "this is job-1"
            - run: echo "independent of anyone"
    job-2:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "this is job-2"
            - run: echo "independent of anyone"
    job-3:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "this is job-3"
            - run: echo "dependent on job-1 & job-2"
        needs:
            - job-1
            - job-2
    job-4:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "this is job-4"
            - run: echo "dependent on job-2 & job-3"
        needs:
            - job-2
            - job-3