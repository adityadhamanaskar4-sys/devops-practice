name: Node.js CI
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        types: [opened, synchronize, reopened]
    workflow_dispatch:
jobs:
    lint-and-test:
        runs-on: atlas
        steps:
            -   name: Checkout repo
                uses: actions/checkout@v4
            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '20'
                    cache: 'npm'
            -   name: Install dependencies
                run: npm ci
            -   name: Run ESLint
                run: npm run lint
            -   name: Run jest test
                run: npm test